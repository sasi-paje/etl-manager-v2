[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-manager-v2"
version = "1.0.0"
description = "Docker-style ETL process manager for MySQL to Supabase PostgreSQL sync"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
etl-manager-v2 = "etl_manager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["etl_manager*"]
